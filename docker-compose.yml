services:

  chromadb:
    image: chromadb/chroma:latest
    container_name: hmas_chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=true

